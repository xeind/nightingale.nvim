# Nightingale for Herdr
# Herdr has no custom theme files: pick the closest built-in, then override
# every token. Append this to ~/.config/herdr/config.toml.

[theme]
name = "kanagawa"

[theme.custom]
accent = "#c6b18e"
panel_bg = "#181616"
# sidebar_bg = "#202020"  # uncomment for an opaque desktop sidebar
surface0 = "#202020"
surface1 = "#2a2a2a"
surface_dim = "#1c1c1c"
overlay0 = "#727169"
overlay1 = "#909398"
text = "#C8C093"
subtext0 = "#ababab"
mauve = "#a584c0"
green = "#98BB6C"
yellow = "#E6C384"
red = "#E46876"
blue = "#85a8da"
teal = "#7cd0bf"
peach = "#f5a284"
